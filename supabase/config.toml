
[functions.send-invoice]
enabled = true
verify_jwt = true
import_map = "./functions/send-invoice/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-invoice/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-invoice/*.html" ]

[functions.send-sms]
enabled = true
# Same reason as send-emails: send-sms does its own auth, and book-appointment
# / cancel-appointment call it server-side with x-internal-secret and no
# Authorization header. verify_jwt=true would 401 them at the gateway.
verify_jwt = false

[functions.send-emails]
enabled = true
# MUST stay false: send-emails does its OWN auth (x-internal-secret for
# server-to-server callers, or a verified user JWT). With verify_jwt=true the
# gateway rejects internal calls (book-appointment, cancel-appointment,
# mollie-webhook, crons) that carry x-internal-secret but no Authorization
# header — silently killing every transactional email. See memory
# email_must_be_server_side.
verify_jwt = false
import_map = "./functions/send-emails/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-emails/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-emails/*.html" ]

[functions.send-reminders]
enabled = true
# Cron-triggered (pg_cron + Vercel proxy) with no Authorization header —
# verify_jwt=true would 401 it at the gateway before it runs.
verify_jwt = false
import_map = "./functions/send-reminders/deno.json"
entrypoint = "./functions/send-reminders/index.ts"

[functions.reschedule-appointment]
enabled = true
# Does its own Bearer-token validation in-function (verifyUser); deployed
# verify_jwt=false since v1.
verify_jwt = false
entrypoint = "./functions/reschedule-appointment/index.ts"
