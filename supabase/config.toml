
[functions.send-invoice]
enabled = true
verify_jwt = true
import_map = "./functions/send-invoice/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-invoice/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-invoice/*.html" ]

[functions.send-sms]
enabled = true
# Same reason as send-emails: send-sms does its own auth, and book-appointment
# / cancel-appointment call it server-side with x-internal-secret and no
# Authorization header. verify_jwt=true would 401 them at the gateway.
verify_jwt = false

[functions.send-emails]
enabled = true
# MUST stay false: send-emails does its OWN auth (x-internal-secret for
# server-to-server callers, or a verified user JWT). With verify_jwt=true the
# gateway rejects internal calls (book-appointment, cancel-appointment,
# mollie-webhook, crons) that carry x-internal-secret but no Authorization
# header — silently killing every transactional email. See memory
# email_must_be_server_side.
verify_jwt = false
import_map = "./functions/send-emails/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-emails/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-emails/*.html" ]

[functions.send-reminders]
enabled = true
# Cron-triggered (pg_cron + Vercel proxy) with no Authorization header —
# verify_jwt=true would 401 it at the gateway before it runs.
verify_jwt = false
import_map = "./functions/send-reminders/deno.json"
entrypoint = "./functions/send-reminders/index.ts"

[functions.reschedule-appointment]
enabled = true
# Does its own Bearer-token validation in-function (verifyUser); deployed
# verify_jwt=false since v1.
verify_jwt = false
entrypoint = "./functions/reschedule-appointment/index.ts"

[functions.payment-qr]
enabled = true
# Public image endpoint: email clients fetch the SEPA QR <img> without any
# auth header, so the gateway must not require a JWT.
verify_jwt = false
entrypoint = "./functions/payment-qr/index.ts"

# De drie hieronder stonden hier NIET in, terwijl ze alle drie al sinds hun eerste
# versie op verify_jwt=false draaien. Zonder regel in dit bestand valt de CLI
# terug op de standaard (true) en zet een deploy ze stilzwijgend om — waarna de
# gateway ze 401't vóórdat de functie ook maar draait. Dat is exact de storing uit
# memory email_must_be_server_side, die maandenlang alle transactionele mail heeft
# gekost. Daarom staan ze nu expliciet vastgelegd, mét de reden.

[functions.book-appointment]
enabled = true
# De publieke boekingspagina roept dit aan als anonieme bezoeker. De functie doet
# haar eigen controles (salon-slug, slot-validatie, kortingscode, no-show-blokkade)
# en heeft geen ingelogde gebruiker nodig.
verify_jwt = false
entrypoint = "./functions/book-appointment/index.ts"

[functions.send-birthday-emails]
enabled = true
# Cron-getriggerd via x-cron-secret (Vercel) of het interne service-secret. Er zit
# geen Authorization-header op, dus verify_jwt=true betekent: nooit meer een
# verjaardagsmail.
verify_jwt = false
entrypoint = "./functions/send-birthday-emails/index.ts"

[functions.mollie-webhook]
enabled = true
# Mollie roept deze URL aan vanaf zijn eigen servers, zonder JWT. De functie
# verifieert de betaling door hem bij Mollie zelf op te halen — dat is de
# authenticatie. Gaat dit op true, dan komt er geen enkele betaling meer binnen.
verify_jwt = false
entrypoint = "./functions/mollie-webhook/index.ts"

[functions.support-chat]
enabled = true
# Dual-mode helpchat: de PUBLIEKE modus (landingspagina) draait zonder inlog en
# dus zonder JWT; de functie regelt zelf de daglimiet en de owner-verificatie.
# Op true zou de gateway de publieke chat 401'en. Live zo sinds v1 (nu v9).
verify_jwt = false
entrypoint = "./functions/support-chat/index.ts"

[functions.send-followups]
enabled = true
# Cron-getriggerd via pg_cron zonder Authorization-header; op true stopt de
# review-mail geruisloos. Live verify_jwt=false (nu v17).
verify_jwt = false
entrypoint = "./functions/send-followups/index.ts"

[functions.calendar-feed]
enabled = true
# Apple Agenda en Google Agenda halen deze ICS-URL zelf op, zonder enige
# Authorization-header; het feed-token in de URL ís de authenticatie. De functie
# stond live al op verify_jwt=false (v5) maar had GEEN regel in dit bestand —
# waardoor de CLI bij de eerstvolgende deploy op de standaard true zou
# terugvallen en de gateway elke geabonneerde agenda zou 401'en. Precies de
# storing uit memory edge_function_source_drift.
verify_jwt = false
entrypoint = "./functions/calendar-feed/index.ts"

[functions.waitlist-notify]
enabled = true
# Aangeroepen door de PUBLIEKE boekingspagina zodra een anonieme bezoeker zich
# op de wachtlijst zet: bevestiging naar de klant, melding naar de salon. Dus
# het AANMELD-pad — niet "er is een plek vrij"; dat laatste loopt via
# notifyWaitlistSpot in src/OwnerApp.jsx. Een anonieme bezoeker heeft geen
# sessie, dus verify_jwt moet false zijn.
verify_jwt = false
entrypoint = "./functions/waitlist-notify/index.ts"

[functions.cancel-appointment]
enabled = true
# De anonieme annuleerpagina (vellu.cc/cancel/TOKEN) roept dit aan; het token
# in de URL ís de authenticatie (plus rate limit per IP). Draait sinds v1 op
# verify_jwt=false — stond alleen nooit in dit bestand, waardoor een CLI-deploy
# hem stilzwijgend op true zou zetten.
verify_jwt = false
entrypoint = "./functions/cancel-appointment/index.ts"

[functions.db-backup]
enabled = true
# Aangeroepen door pg_cron (03:00) met de service-role-sleutel, niet door een
# gebruiker. Stond niet in dit bestand, waardoor een CLI-deploy hem op de
# standaard verify_jwt=true zou zetten en de gateway de nachtelijke back-up zou
# 401'en. Live draait hij op false (v9).
verify_jwt = false
entrypoint = "./functions/db-backup/index.ts"

[functions.cron-watchdog]
enabled = true
# Idem: dagelijkse aanroep vanuit pg_cron, geen gebruikers-JWT. Dit is de
# functie die alarm slaat als een cron stilvalt — juist die moet niet zelf
# stilvallen door een ontbrekend blok hier. Live op false (v10).
verify_jwt = false
entrypoint = "./functions/cron-watchdog/index.ts"

[functions.check-pending-payments]
enabled = true
# Vangnet onder mollie-webhook: zoekt eerste betalingen die zijn gestart maar
# nooit een uitkomst kregen, en trapt de webhook er opnieuw voor aan. Wordt door
# pg_cron aangeroepen zonder gebruikers-JWT, dus verify_jwt moet false zijn.
# Bewust geen geheim: de functie geeft alleen aantallen terug en het enige wat
# je ermee kunt is een idempotente herverwerking starten.
verify_jwt = false
entrypoint = "./functions/check-pending-payments/index.ts"

[functions.send-renewal-reminder]
enabled = true
# Cron: waarschuwt een jaarabonnee een week voor plan_expires_at. Aangeroepen
# door pg_cron zonder gebruikers-JWT, dus verify_jwt=false.
verify_jwt = false
entrypoint = "./functions/send-renewal-reminder/index.ts"
